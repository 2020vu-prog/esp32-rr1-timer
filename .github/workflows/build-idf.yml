# @format

name: Build with ESP-IDF v5.5.3

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run clang-format
        uses: RafikFarhad/clang-format-github-action@v6
        with:
          sources: "components/**/*.h,components/**/*.c,main/*.h,main/*.c"

      - name: Set up ESP-IDF v5.5.3
        uses: espressif/esp-idf-ci-action@v1
        if: github.event_name == 'pull_request'
        with:
          esp_idf_version: "v5.5.3"
          target: esp32c5

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        if: github.event_name == 'pull_request'
        with:
          name: esp-build
          path: build/esp32-rr1-timer.bin


      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        if: github.event_name == 'pull_request'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Sync files to S3 bucket
        run: |
          aws s3 sync tools s3://my-bucket-name --delete

