# @format

name: Build with ESP-IDF v5.5.3

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run clang-format
        uses: RafikFarhad/clang-format-github-action@v6
        with:
          sources: "components/**/*.h,components/**/*.c,main/*.h,main/*.c"

      - name: Set up ESP-IDF v5.5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: "v5.5.3"
          target: esp32c5

      - name: save build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: esp-build
          path: build/esp32-rr1-timer.bin


      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: "arn:aws:iam::178616746534:role/github-actions-s3-upload-role"
          aws-region: us-east-2

      - name: Sync files to S3 bucket
        if: github.ref == 'refs/heads/dev'
        run: |
          aws s3 cp  --cache-control 'max-age=180' build/esp32-rr1-timer.bin  s3://svelte-static-20221204164305433000000002/firmware/esp32-rr1-timer.bin

