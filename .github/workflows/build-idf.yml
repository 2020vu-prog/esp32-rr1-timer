# @format

name: Build with ESP-IDF v6.0.3
env:
  BRANCH_NAME: ${{ github.ref_name }} # Workflow Level

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download generated protobuf bindings
        env:
          GH_TOKEN: ${{ github.token }}
          # Pin the protocol definitions; bump when timer.proto changes.
          RR1_PROTO_TAG: v1.0.0
        run: |
          ./tools/download_rr1_messages_artifact.sh

      - name: Run clang-format
        uses: RafikFarhad/clang-format-github-action@v6
        with:
          sources: "components/**/*.h,components/**/*.c,main/*.h,main/*.c"
          excludes: "components/rr1_messages/timer.pb-c.c,components/rr1_messages/timestamp.pb-c.c,components/rr1_messages/include/timer.pb-c.h,components/rr1_messages/include/google/protobuf/timestamp.pb-c.h"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Set up ESP-IDF v6.0.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: "v6.0.3"
          target: esp32c5

      - name: save build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: esp-build
          path: build/esp32-rr1-timer.bin

  aws_deploy:
    if: github.ref_name == 'dev' || github.ref_name == 'go.rr1.us'
    needs: build
    runs-on: ubuntu-latest
    environment: aws
    # Serialize uploads per branch so overlapping runs cannot race on the S3 object.
    concurrency:
      group: aws-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set environment variables
        run: |
          ./tools/aws_env.sh

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: esp-build
          path: build

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: "arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-actions-s3-upload-role"
          aws-region: us-east-2

      - name: Reject stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/${{ github.ref_name }}" --jq .object.sha)
          if [ "$head_sha" != "${{ github.sha }}" ]; then
            echo "::error::${{ github.ref_name }} is now at $head_sha, not ${{ github.sha }}; refusing to upload stale firmware."
            exit 1
          fi

      - name: Sync files to S3 bucket
        run: |
          aws s3 cp  --cache-control 'max-age=180' build/esp32-rr1-timer.bin  s3://${{ env.AWS_BUCKET }}/firmware/esp32-rr1-timer.bin
