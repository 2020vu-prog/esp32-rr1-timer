name: Promote environment branch

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA on dev that successfully built and deployed
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  promote:
    name: Promote go.rr1.us
    runs-on: ubuntu-latest
    environment:
      name: go.rr1.us

    steps:
      - name: Verify build and target branch
        id: promote
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const sourceBranch = "dev";
            const targetBranch = "go.rr1.us";
            const sourceSha = context.payload.inputs.source_sha;

            if (!/^[0-9a-f]{40}$/i.test(sourceSha)) {
              core.setFailed("Provide a full 40-character source SHA.");
              return;
            }

            const { owner, repo } = context.repo;
            const sourceRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${sourceBranch}`,
            });
            if (sourceRef.data.object.sha !== sourceSha) {
              core.setFailed(
                `${sourceBranch} is ${sourceRef.data.object.sha}, not requested ${sourceSha}.`
              );
              return;
            }

            const buildRuns = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: "build-idf.yml",
                branch: sourceBranch,
                status: "completed",
                per_page: 100,
              }
            );
            const successfulRun = buildRuns.find(
              (run) => run.head_sha === sourceSha && run.conclusion === "success"
            );
            if (!successfulRun) {
              core.setFailed(
                `No successful build-idf run exists for ${sourceBranch} at ${sourceSha}.`
              );
              return;
            }

            const targetRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${targetBranch}`,
            });
            if (targetRef.data.object.sha === sourceSha) {
              core.notice(`${targetBranch} already points to ${sourceSha}.`);
            }
            core.setOutput("source_sha", sourceSha);
            core.setOutput("target_branch", targetBranch);
            core.setOutput("target_sha", targetRef.data.object.sha);
            core.notice(
              `Verified ${sourceSha} from ${sourceBranch}; source build run: ${successfulRun.html_url}`
            );

      - name: Check out approved source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.promote.outputs.source_sha }}
          fetch-depth: 1

      - name: Reset target branch with lease
        env:
          SOURCE_SHA: ${{ steps.promote.outputs.source_sha }}
          TARGET_BRANCH: ${{ steps.promote.outputs.target_branch }}
          TARGET_SHA: ${{ steps.promote.outputs.target_sha }}
        run: |
          git push origin "${SOURCE_SHA}:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${TARGET_SHA}"

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so start the
      # build and AWS deploy for the promoted branch explicitly.
      - name: Deploy promoted environment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TARGET_BRANCH: ${{ steps.promote.outputs.target_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "build-idf.yml",
              ref: process.env.TARGET_BRANCH,
            });
